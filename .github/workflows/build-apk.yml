name: Build APK

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: '构建哪个版本'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - leanback
          - mobile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          ref: fongmi
          fetch-depth: 0
          lfs: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate signing keystore
        run: |
          keytool -genkey -v -keystore $HOME/release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias hermes -storepass hermes123 -keypass hermes123 \
            -dname "CN=Hermes, OU=Hermes, O=Hermes, L=City, S=State, C=CN"

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "storeFile=$HOME/release.jks" >> local.properties
          echo "keyAlias=hermes" >> local.properties
          echo "storePassword=hermes123" >> local.properties
          echo "keyPassword=hermes123" >> local.properties

      - name: Grant gradlew exec
        run: chmod +x gradlew

      - name: Build leanback APK
        if: github.event.inputs.flavor != 'mobile'
        run: ./gradlew :app:assembleLeanbackRelease --stacktrace

      - name: Build mobile APK
        if: github.event.inputs.flavor != 'leanback'
        run: ./gradlew :app:assembleMobileRelease --stacktrace

      - name: Upload APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FongMi TV Build #${{ github.run_number }}
          files: |
            app/build/outputs/apk/leanback/release/*.apk
            app/build/outputs/apk/mobile/release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: false

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [fongmi]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          ref: fongmi
          fetch-depth: 0
          lfs: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # runner 镜像已预装 Android SDK，这里直接补装缺失组件并接受 license
      - name: Setup Android SDK (preinstalled)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37" \
            "platform-tools" || sdkmanager "platforms;android-37" "platform-tools" || true
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Generate signing keystore
        run: |
          keytool -genkey -v -keystore $HOME/release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias hermes -storepass hermes123 -keypass hermes123 \
            -dname "CN=Hermes, OU=Hermes, O=Hermes, L=City, S=State, C=CN"

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "storeFile=$HOME/release.jks" >> local.properties
          echo "keyAlias=hermes" >> local.properties
          echo "storePassword=hermes123" >> local.properties
          echo "keyPassword=hermes123" >> local.properties

      - name: Grant gradlew exec
        run: chmod +x gradlew

      - name: Build leanback APK
        id: build_leanback
        continue-on-error: true
        run: ./gradlew :app:assembleLeanbackRelease --no-daemon --stacktrace

      - name: Build mobile APK
        run: ./gradlew :app:assembleMobileRelease --no-daemon --stacktrace

      # 即使某个 flavor 失败也尝试上传成功的
      - name: Collect APKs
        if: always()
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name '*.apk' -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist/ || true

      - name: Upload APKs to Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FongMi TV Build #${{ github.run_number }}
          files: dist/*.apk
          fail_on_unmatched_files: false
          generate_release_notes: false
